<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Changa;font-weight:800;src:url(../../fonts/changa-arabic-800-normal.woff2)}
@font-face{font-family:Changa;font-weight:500;src:url(../../fonts/changa-arabic-500-normal.woff2)}
@font-face{font-family:Changa;font-weight:500;src:url(../../fonts/changa-latin-500-normal.woff2)}
@font-face{font-family:Saira;font-weight:800;src:url(../../fonts/saira-latin-800-normal.woff2)}
:root{--bg:#0D0D0D;--red:#D7191F;--redt:#FF4A4F;--muted:#BDBDBD}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:var(--bg);overflow:hidden;position:relative;font-family:Changa,sans-serif;color:#fff}
.photo{position:absolute;left:0;top:250px;width:1080px;height:780px;background:url(bg.png) 50% 46%/720px auto no-repeat;
 -webkit-mask-image:radial-gradient(ellipse 48% 50% at 50% 50%,#000 62%,transparent 100%);mix-blend-mode:lighten}
.logo{position:absolute;top:40px;left:50%;width:360px;transform:translateX(-50%);mix-blend-mode:lighten}
svg.road{position:absolute;left:0;top:0}
.copy{position:absolute;right:80px;left:80px;bottom:140px;text-align:center}
h1{font-weight:800;font-size:80px;line-height:1.3;white-space:nowrap;transform:skewX(-9deg)}
h1 .a{background:linear-gradient(180deg,#FFFFFF,#D6D6D6 55%,#8E8E8E);-webkit-background-clip:text;color:transparent;padding:0 6px}
h1 .b{background:linear-gradient(180deg,#FF4A4F,#B80E16);-webkit-background-clip:text;color:transparent;padding:0 6px}
.sub{margin-top:4px;font-weight:500;font-size:36px;color:var(--muted)}
.foot{position:absolute;bottom:62px;left:80px;right:80px;display:flex;justify-content:center;align-items:center;gap:26px;font-size:30px;color:var(--muted);font-weight:500}
.foot .phone{font-family:Saira;font-weight:800;font-size:36px;color:#fff;letter-spacing:.06em}
.foot .dot{width:8px;height:8px;background:var(--red);transform:skewX(-20deg)}
</style></head><body>
<div class="photo"></div>
<!-- road: bumpy red line enters from the left, the strut absorbs it, it leaves flat and white -->
<svg class="road" width="1080" height="1350" viewBox="0 0 1080 1350">
 <defs>
  <linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="0" x2="420" y1="0" y2="0"><stop offset="0" stop-color="#FF4A4F" stop-opacity="0"/><stop offset=".25" stop-color="#FF4A4F" stop-opacity=".9"/><stop offset="1" stop-color="#FF4A4F"/></linearGradient>
  <linearGradient id="gr" gradientUnits="userSpaceOnUse" x1="660" x2="1080" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".75" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
 <path d="M0 640 Q28 640 56 640 Q84 612 112 640 Q140 588 168 640 Q196 556 224 640 Q252 520 280 640 Q308 480 336 640 Q364 448 392 640 L416 640" fill="none" stroke="url(#gl)" stroke-width="6" filter="url(#glow)"/>
 <path d="M660 640 L1080 640" fill="none" stroke="url(#gr)" stroke-width="4"/>
</svg>
<img class="logo" src="../../logo-original.jpg">
<div class="copy">
  <h1><span class="a">كل مطب..</span> <span class="b">تحت السيطرة</span></h1>
  <p class="sub">صيانة وقطع أنظمة التعليق للسيارات اليابانية والكورية</p>
</div>
<div class="foot"><span class="phone" dir="ltr">0791175259</span><span class="dot"></span><span>عمّان - القويسمة - شارع منور الحديد</span></div>
</body></html>
