<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Changa;font-weight:800;src:url(../../fonts/changa-arabic-800-normal.woff2)}
@font-face{font-family:Changa;font-weight:500;src:url(../../fonts/changa-arabic-500-normal.woff2)}
@font-face{font-family:Changa;font-weight:500;src:url(../../fonts/changa-latin-500-normal.woff2)}
@font-face{font-family:Saira;font-weight:800;src:url(../../fonts/saira-latin-800-normal.woff2)}
:root{--bg:#0D0D0D;--red:#D7191F;--redt:#FF4A4F;--muted:#BDBDBD}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:var(--bg);overflow:hidden;position:relative;font-family:Changa,sans-serif;color:#fff}
.photo{position:absolute;left:0;top:0;width:1080px;height:1350px;background:url(bg.png) 0% 0%/auto 1350px no-repeat;mix-blend-mode:lighten;
 -webkit-mask-image:linear-gradient(90deg,#000 0%,#000 40%,transparent 68%)}
svg.ecg{position:absolute;left:0;top:0}
.col{position:absolute;right:80px;top:150px;width:600px}
.kicker{font-family:Saira;font-weight:800;font-size:22px;letter-spacing:.4em;color:var(--redt);direction:ltr;text-align:right;margin-bottom:10px}
h1{font-weight:800;font-size:88px;line-height:1.3;white-space:nowrap;transform:skewX(-9deg);transform-origin:right}
h1 span{display:block}
h1 .a{background:linear-gradient(180deg,#FFFFFF,#D6D6D6 55%,#8E8E8E);-webkit-background-clip:text;color:transparent}
h1 .b{background:linear-gradient(180deg,#FF4A4F,#B80E16);-webkit-background-clip:text;color:transparent;padding-bottom:14px}
.sub{margin-top:150px;font-weight:500;font-size:34px;line-height:1.5;color:var(--muted)}
.logo{position:absolute;right:66px;bottom:150px;width:420px;mix-blend-mode:lighten}
.foot{position:absolute;right:80px;bottom:62px;display:flex;align-items:center;gap:22px;font-size:28px;color:var(--muted);font-weight:500}
.foot .phone{font-family:Saira;font-weight:800;font-size:34px;color:#fff;letter-spacing:.06em}
.foot .dot{width:8px;height:8px;background:var(--red);transform:skewX(-20deg)}
</style></head><body>
<div class="photo"></div>
<svg class="ecg" width="1080" height="1350" viewBox="0 0 1080 1350">
 <defs>
  <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="300" x2="1080" y1="0" y2="0"><stop offset="0" stop-color="#FF4A4F" stop-opacity="0"/><stop offset=".3" stop-color="#FF4A4F"/><stop offset="1" stop-color="#FF4A4F" stop-opacity=".25"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
 <path id="p" d="M330 520 L560 520 L585 490 L608 520 L630 520 L658 440 L690 585 L718 495 L740 520 L790 520 L810 505 L830 520 L1080 520" fill="none" stroke="url(#g)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
<div class="col">
  <div class="kicker">ENGINE &amp; OIL</div>
  <h1><span class="a">نبض المحرك</span><span class="b">يبدأ من زيته</span></h1>
  <p class="sub">صيانة المحركات وتغيير الزيت<br>للسيارات اليابانية والكورية</p>
</div>
<img class="logo" src="../../logo-original.jpg">
<div class="foot"><span>عمّان - القويسمة - شارع منور الحديد</span><span class="dot"></span><span class="phone" dir="ltr">0791175259</span></div>
</body></html>
